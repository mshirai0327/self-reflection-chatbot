services:
  db:
    image: mysql:8.0
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ai_reflection_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ai_network

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - ai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DATABASE_URL: "mysql://user:password@db:3306/ai_reflection_db"
    environment:
      DATABASE_URL: "mysql://user:password@db:3306/ai_reflection_db"
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      CHROMA_URL: "http://chromadb:8000"
      IS_DOCKER: "true"
    depends_on:
      - db
      - chromadb
    networks:
      - ai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  db_data:
  chroma_data:
