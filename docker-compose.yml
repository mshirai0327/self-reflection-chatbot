services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_reflection_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - ai_network

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - ai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DATABASE_URL: "postgresql://user:password@db:5432/ai_reflection_db"
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/ai_reflection_db"
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      CHROMA_URL: "http://chromadb:8000"
      IS_DOCKER: "true"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password"
      LLM_SERVICE_URL: "http://llm-service:8080"
    depends_on:
      - db
      - chromadb
      - neo4j
      - llm-service
    networks:
      - ai_network

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    environment:
      GOOGLE_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password"
    ports:
      - "8080:8080"
    depends_on:
      - neo4j
    networks:
      - ai_network

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - ai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge

volumes:
  db_data:
  chroma_data:
  neo4j_data:
