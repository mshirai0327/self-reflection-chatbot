name: Run Tests

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_reflection_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d ai_reflection_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/ai_reflection_db
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install and Test
        run: |
          cd backend
          npm ci
          npx prisma generate
          npx prisma db push
          npm run test

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          cd llm-service
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Python tests
        env:
          GOOGLE_API_KEY: "dummy_key_for_ci"
          GOOGLE_GENERATIVE_AI_API_KEY: "dummy_key_for_ci"
          NEO4J_URI: "bolt://localhost:7687"
        run: |
          cd llm-service
          pytest tests/
