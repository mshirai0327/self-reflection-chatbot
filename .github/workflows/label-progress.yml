name: Auto Label on Project Status Change

on:
  # NOTE: PROJECT_TOKEN シークレットが設定されていないため、スケジュール実行を無効化しています。
  # GitHub Projects V2 へのアクセスには、project権限を持つPATが必要です。
  # PATを設定後、以下のscheduleをアンコメントしてください：
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  label_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      repository-projects: read
    steps:
      - name: Sync Project Status to Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            // プロジェクト番号（必要に応じて変更してください）
            // ユーザーや組織のプロジェクトを特定するために必要
            const PROJECT_NUMBER = 1; 
            const OWNER = context.repo.owner;

            const query = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                            number
                            repository {
                              name
                              owner {
                                login
                              }
                            }
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2FieldCommon {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
                organization(login: $owner) {
                  projectV2(number: $number) {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                            number
                            repository {
                              name
                              owner {
                                login
                              }
                            }
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2FieldCommon {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const result = await github.graphql(query, { owner: OWNER, number: PROJECT_NUMBER });
              
              // UserまたはOrgからプロジェクトを取得
              const project = (result.user && result.user.projectV2) || (result.organization && result.organization.projectV2);
              
              if (!project) {
                console.error(`Project not found: ${OWNER}/projects/${PROJECT_NUMBER}`);
                return;
              }

              console.log(`Checking ${project.items.nodes.length} items in project...`);

              for (const item of project.items.nodes) {
                if (!item.content || !item.content.number) continue;

                const statusField = item.fieldValues.nodes.find(node => node.field && node.field.name === 'Status');
                const currentStatus = statusField ? statusField.name : 'No Status';
                const issueNumber = item.content.number;
                const repoName = item.content.repository.name;
                const repoOwner = item.content.repository.owner.login;

                if (currentStatus === 'In Progress') {
                  console.log(`Issue #${issueNumber} in ${repoName} is In Progress. Ensuring label exists.`);
                  try {
                    await github.rest.issues.addLabels({
                      owner: repoOwner,
                      repo: repoName,
                      issue_number: issueNumber,
                      labels: ['In Progress']
                    });
                  } catch (e) {
                    console.error(`Failed to add label to #${issueNumber}: ${e.message}`);
                  }
                }
              }
            } catch (error) {
              console.error("Error during synchronization:", error);
              core.setFailed(error.message);
            }